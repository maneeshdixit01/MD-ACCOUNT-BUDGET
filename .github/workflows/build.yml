name: Build Signed MD Accounts Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web assets and Capacitor
        run: |
          npm install
          mkdir -p www
          find . -maxdepth 1 -type f \\( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.svg" -o -name "*.ico" \\) \\! -name "package*.json" \\! -name "capacitor.config.json" -exec cp {} www/ \\;
          test -f www/index.html || { echo "ERROR: index.html missing"; exit 1; }
          npx cap add android || true
          npx cap sync android

      - name: Generate app icons (if icon-512.png exists)
        run: |
          if [ -f icon-512.png ]; then
            npm exec capacitor-assets generate -- --android
          fi

      - name: Add AdMob App ID to Android manifest
        run: |
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml || \\
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5831881293330144~2578300444"/>\\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Decode release keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 GitHub Secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/md-release-key.jks
          test -s android/app/md-release-key.jks

      - name: Build signed AAB and APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD GitHub Secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD GitHub Secret"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \\
            -Pandroid.injected.signing.store.file="$PWD/app/md-release-key.jks" \\
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \\
            -Pandroid.injected.signing.key.alias=md_key \\
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload AAB and APK (never upload keystore)
        uses: actions/upload-artifact@v4
        with:
          name: MD-Accounts-Release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
