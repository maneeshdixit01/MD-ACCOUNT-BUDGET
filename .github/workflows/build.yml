
name: Build Signed MD Accounts Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout Repository
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Prepare Web Assets and Capacitor
      - name: Prepare web assets and Capacitor
        shell: bash
        run: |
          set -e

          npm install

          mkdir -p www

          for file in *.html *.css *.js *.json *.png *.jpg *.jpeg *.svg *.ico; do
            [ -f "$file" ] || continue

            case "$file" in
              package.json|package-lock.json|capacitor.config.json)
                continue
                ;;
            esac

            cp "$file" www/
          done

          test -f www/index.html || {
            echo "ERROR: index.html missing"
            exit 1
          }

          npx cap add android
          npx cap sync android

      # 5. Generate App Icons
      - name: Generate app icons
        shell: bash
        run: |
          if [ -f icon-512.png ]; then
            npm exec capacitor-assets generate -- --android
          else
            echo "icon-512.png not found; using default icons"
          fi

      # 6. Add AdMob App ID
      - name: Add AdMob App ID to Android Manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Android Manifest not found"
            exit 1
          fi

          if ! grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$MANIFEST"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5831881293330144~2578300444"/>\
          </application>|' "$MANIFEST"
          fi

      # 7. Decode Signing Key
      - name: Decode release keystore from GitHub Secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/md-release-key.jks

          test -s android/app/md-release-key.jks

      # 8. Build Signed AAB and APK
      - name: Build signed AAB and APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret missing"
            exit 1
          fi

          cd android

          chmod +x gradlew

          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/md-release-key.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=md_key \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 9. Upload AAB and APK
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Accounts-Release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
