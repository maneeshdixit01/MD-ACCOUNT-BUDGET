name: Build Signed Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor
        run: |
          rm -rf package.json package-lock.json node_modules android capacitor.config.json capacitor.config.ts www
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.svg" -o -name "*.ico" \) ! -name "package*.json" ! -name "capacitor.config.json" ! -name "tsconfig.json" -exec cp {} www/ \;
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              echo "<h1>MD Accounts</h1>" > www/index.html
            fi
          fi
          npx cap init "MD Accounts" "com.md.accountbudget" --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Prepare Keystore (Digital Signing Key)
        run: |
          # अगर रिपॉजिटरी में पहले से चाबी रखी है तो वही इस्तेमाल करेगा, वरना नई बनाएगा
          if [ -f "md-release-key.jks" ]; then
            cp md-release-key.jks android/app/md-release-key.jks
          else
            keytool -genkey -v -keystore android/app/md-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias md_key \
              -storepass MdAccount@123 -keypass MdAccount@123 \
              -dname "CN=Maneesh Kumar Dixit, OU=IT, O=MD Accounts, L=Lucknow, ST=UP, C=IN"
            cp android/app/md-release-key.jks ./md-release-key.jks
          fi

      - name: Build & Sign Release AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/md-release-key.jks \
            -Pandroid.injected.signing.store.password=MdAccount@123 \
            -Pandroid.injected.signing.key.alias=md_key \
            -Pandroid.injected.signing.key.password=MdAccount@123

      - name: Upload Signed AAB, APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MD-Accounts-Release-Bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            md-release-key.jks
