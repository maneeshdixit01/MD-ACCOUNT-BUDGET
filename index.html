<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145c50">
<title>MD Account & Budget Management</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--green:#145c50;--green-dark:#0b433a;--mint:#bce8d9;--green2:#e3f3ee;--bg:#f4f7f6;--card:#fff;--text:#172b27;--muted:#687b76;--line:#e1e9e6;--red:#b42318;--amber:#986500;--blue:#2457a7;--fab-bg:#1a8a72}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f0f7f4 0%,#f4f7f6 300px);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;padding-bottom:70px}
header{background:linear-gradient(135deg,#0b433a 0%,#145c50 45%,#1a8a72 70%,#26836f 100%);color:white;padding:24px 16px 22px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px #0b433a20;position:relative;overflow:hidden}
header:after{content:"₹";position:absolute;right:18px;top:-24px;font-size:110px;font-weight:900;color:#ffffff10;pointer-events:none}
header:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffff22,transparent 60%);pointer-events:none}
.wrap{max-width:850px;margin:auto;padding:14px 12px 92px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 4px 14px #163e3508;transition:box-shadow .2s, transform .2s}
.card:hover{box-shadow:0 6px 20px #163e3515}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric small{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.2px}
.metric{cursor:pointer;text-align:left;width:100%;font:inherit;display:block;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;border:0}
.metric:before{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:currentColor;opacity:.05}
.metric:active{transform:scale(.97)}
.metric .tap-hint{font-size:10px;color:var(--green);margin-top:7px;font-weight:700}
.metric strong{display:block;font-size:22px;margin-top:7px;overflow-wrap:anywhere}
.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}
.section-title{font-size:17px;margin:16px 2px 10px}.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;background:linear-gradient(135deg,var(--green),#217b68);color:#fff;border-radius:12px;padding:12px 15px;font-weight:750;font-size:14px;cursor:pointer;box-shadow:0 3px 8px #145c501a;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.08);box-shadow:0 5px 12px #145c5025}
.btn.secondary{background:var(--green2);color:var(--green)}
.btn.danger{background:#fff0ee;color:var(--red)}
.btn.small{padding:7px 9px;font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;border:1px solid #d5e0dc;border-radius:10px;background:#fff;padding:11px 10px;font:inherit;font-size:14px;color:var(--text);min-width:0;transition:border-color .2s}
input:focus,select:focus{outline:2px solid #9ed4c5;border-color:var(--green)}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.amount{font-weight:800;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
.notice{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;color:#78580b;border-radius:12px;padding:11px;font-size:12px;line-height:1.5;margin:10px 0}
.hidden{display:none!important}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:20px}
.topbar{display:flex;align-items:center;gap:12px;margin:-24px -16px 18px;padding:14px 16px 0;position:relative;z-index:1}
.menu-btn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:12px;width:44px;height:42px;font-size:25px;cursor:pointer}
.topbar-title{font-size:20px;font-weight:800}.topbar-sub{font-size:11px;color:#d9eee8}
.lang-toggle{margin-left:auto;border:1px solid #ffffff88;background:#ffffff20;color:#fff;border-radius:11px;padding:8px 11px;font-weight:800;font-size:12px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div>
      <div class="topbar-title">MD Account & Budget Management</div>
      <div class="topbar-sub">व्यक्तिगत आय-व्यय और वित्तीय स्थिति</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2 class="section-title">रिपोर्ट और डेटा सुरक्षा</h2>
    <div class="actions">
      <button class="btn" onclick="exportData()">JSON बैकअप डाउनलोड</button>
      <label class="btn secondary filelabel"><span>बैकअप रीस्टोर</span><input type="file" accept="application/json" onchange="importData(event)" hidden></label>
    </div>
    <p class="hint">रीस्टोर करने से पहले वर्तमान डेटा का बैकअप लें।</p>
  </section>
</main>

<script>
let db = { accounts: [], txns: [] };

// Capacitor Filesystem & Share आधारित सुरक्षित बैकअप एक्सपोर्ट फंक्शन
async function exportData() {
  const fileName = "MD_Accounts_Backup_" + new Date().toISOString().slice(0,10) + ".json";
  const jsonData = JSON.stringify(db, null, 2);
  try {
    const plugins = window.Capacitor && window.Capacitor.Plugins;
    const Filesystem = plugins && plugins.Filesystem;
    const Share = plugins && plugins.Share;
    
    if (Filesystem && Share) {
      const saved = await Filesystem.writeFile({
        path: fileName,
        data: jsonData,
        directory: 'CACHE',
        encoding: 'utf8'
      });
      const fileUri = saved.uri || (await Filesystem.getUri({path: fileName, directory: 'CACHE'})).uri;
      await Share.share({
        title: 'MD Accounts JSON Backup',
        text: 'अपनी JSON बैकअप फाइल सुरक्षित जगह पर Save करें।',
        files: [fileUri],
        dialogTitle: 'JSON Backup Save करें'
      });
      return;
    }
    
    // ब्राउज़र फॉलबैक
    const blob = new Blob([jsonData], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) {
    console.error('JSON backup export failed:', e);
    alert('बैकअप फाइल तैयार/सेव नहीं हो सकी: ' + (e && e.message ? e.message : e));
  }
}

function importData(e) {
  let f = e.target.files[0];
  if (!f) return;
  let r = new FileReader();
  r.onload = () => {
    try {
      let d = JSON.parse(r.result);
      if (!Array.isArray(d.accounts) || !Array.isArray(d.txns)) throw Error();
      db = d;
      alert('बैकअप लोड हो गया।');
    } catch (err) {
      alert('सही बैकअप फ़ाइल नहीं है।');
    }
    e.target.value = '';
  };
  r.readAsText(f);
}
</script>

<!-- Google AdMob इंटीग्रेशन (दिए गए क्रेडेंशियल्स के अनुसार) -->
<script>
(function(){
  const ADMOB_BANNER_ID = 'ca-app-pub-5831881293330144/2591789064';
  const ADMOB_INTERSTITIAL_ID = 'ca-app-pub-5831881293330144/8965625723';
  const ADMOB_REWARDED_ID = 'ca-app-pub-5831881293330144/7767047947';

  let AdMobPlugin = null;
  let interstitialReady = false;
  let rewardedReady = false;

  async function initAdMob() {
    const cap = window.Capacitor;
    if (!cap || !cap.Plugins || !cap.Plugins.AdMob) return;
    AdMobPlugin = cap.Plugins.AdMob;

    try {
      await AdMobPlugin.initialize({ initializeForTesting: false });

      await AdMobPlugin.showBanner({
        adId: ADMOB_BANNER_ID,
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0
      });
      document.body.style.paddingBottom = '120px';

      await preloadInterstitial();
      await preloadRewarded();
    } catch (e) {
      console.log('AdMob init info:', e);
    }
  }

  async function preloadInterstitial() {
    if (!AdMobPlugin) return;
    try {
      await AdMobPlugin.prepareInterstitial({ adId: ADMOB_INTERSTITIAL_ID });
      interstitialReady = true;
    } catch (e) { interstitialReady = false; }
  }

  async function preloadRewarded() {
    if (!AdMobPlugin) return false;
    try {
      await AdMobPlugin.prepareRewardVideoAd({ adId: ADMOB_REWARDED_ID });
      rewardedReady = true;
      return true;
    } catch (e) {
      rewardedReady = false;
      return false;
    }
  }

  window.showAppVideoAd = async function() {
    if (!AdMobPlugin) return;
    try {
      if (interstitialReady) {
        await AdMobPlugin.showInterstitial();
        interstitialReady = false;
        setTimeout(preloadInterstitial, 2000);
      } else { preloadInterstitial(); }
    } catch (e) { preloadInterstitial(); }
  };

  window.showAppRewardAd = async function(onSuccess) {
    if (!AdMobPlugin) { if (onSuccess) onSuccess(); return; }
    try {
      if (!rewardedReady) await preloadRewarded();
      if (rewardedReady) {
        await AdMobPlugin.showRewardVideoAd();
        rewardedReady = false;
        setTimeout(preloadRewarded, 2000);
      }
    } catch (e) {
      rewardedReady = false;
      setTimeout(preloadRewarded, 2000);
    }
    if (onSuccess) onSuccess();
  };

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(initAdMob, 1200);
  });
})();
</script>

</body>
</html>
